<!DOCTYPE html>
<head>
    <title>TABLE</title>
</head>
<body>
    <table border="1" cellpadding="20">
        <!-- TR(Table Row)/Baris -->
         <!-- TH(Table Head) -->
          <!-- Menyambungkan dua baris yang berbeda yaitu dengan rowspan -->
          <!-- Menyambungkan dua kolom yang berbeda yaitu dengan colspan -->
        <tr>
            <th rowspan="2">NO</th>
            <th rowspan="2">Nama</th>
            <th colspan="3">Pertemuan</th>
        </tr>

        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Guita</td>
            <td>Hadir</td>
            <td>Hadir</td>
            <td>Hadir</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Roko</td>
            <td>Hadir</td>
            <td>Bolos</td>
            <td>Bolos</td>
        </tr>

    </table>

    <a href="index.html">Kembali ke Halaman Awal</a>
    <a href="form.html">Menuju Form</a>
</body>
</html>
